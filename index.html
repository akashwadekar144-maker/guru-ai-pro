<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru AI Pro</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #0f0f12; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #161622; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 2px solid #d4af37; color: #d4af37; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px; border-radius: 10px; line-height: 1.5; }
        .ai-msg { background-color: #23232f; align-self: flex-start; }
        .user-msg { background-color: #d4af37; color: #000; align-self: flex-end; }
        .input-area { padding: 15px; background-color: #161622; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #0f0f12; color: #fff; outline: none; }
        button { background: #d4af37; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">🔮 GURU AI SUPER MASTER PRO</div>
    <div class="chat-container" id="chatBox">
        <div class="message ai-msg">Pranam! Main aapka Guru AI Super Master Pro hoon. Aaj aap kya seekhna chahte hain?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Apna sawal yahan likhein...">
        <button onclick="sendMessage()">Bhejein</button>
    </div>
    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            if(!input.value.trim()) return;
            
            let userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = input.value;
            chatBox.appendChild(userDiv);
            
            let aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-msg';
            aiDiv.innerText = "Guru AI aapke server se connect ho raha hai...";
            setTimeout(() => { chatBox.appendChild(aiDiv); chatBox.scrollTop = chatBox.scrollHeight; }, 500);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
