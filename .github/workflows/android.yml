name: Android CI/CD Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Workspace & Zip Source
      run: |
        echo "Guru AI Master Pro build system running..."
        zip -r Guru_AI_Pro_Source.zip ./*

    - name: Upload Source & Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Guru-AI-Pro-Package
        path: |
          Guru_AI_Pro_Source.zip
          *.xml
          *.txt
